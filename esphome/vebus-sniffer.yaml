# ===========================================================================
# Eigener ESP32: passiver VE.Bus-Mitschnitt fuer das Digital Multi Control (DMC)
#
# Hoert am VE.Bus nur zu und streamt jeden Rahmen per TCP (Port 8484) an
# tools/vebus_capture.py. Diese Firmware KANN nicht senden: Der UART hat keinen
# TX-Pin, der Dateneingang des RS485-Moduls liegt fest an VCC.
# Versorgung ueber den VE.Bus (Pin 2/3, nur ca. 700 mW), daher auf wenig Verbrauch
# getrimmt: 80 MHz, WLAN-Modem-Sleep, reduzierte Sendeleistung.
# WireGuard wie die anderen Womo-ESPs: eigener Peer in der Fritzbox, 192.168.100.210.
# Verdrahtung und Ablauf: docs/VEBUS-MITSCHNITT.md
#
# Erstes Flashen per USB, danach OTA:
#   .\.venv\Scripts\esphome.exe run esphome\vebus-sniffer.yaml --device COMx
# ===========================================================================

substitutions:
  name: vebus-sniffer
  friendly_name: "VE.Bus Sniffer"
  rx_pin: "16"              # GPIO16 <- Modulausgang (Modul an 3,3 V; bei 5 V nur ueber Teiler 1k/2k)

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  includes:
    - vebus_sniffer.h
  on_boot:
    priority: -100          # nach dem Netzwerk-Stack
    then:
      - lambda: vebus_sniffer::start(${rx_pin});

esp32:
  board: esp32dev
  cpu_frequency: 80MHz      # reicht fuer 256 kBaud und spart Strom
  framework:
    type: esp-idf

logger:
  level: INFO
  baud_rate: 115200

api:
  encryption:
    key: !secret sniffer_api_encryption_key
  reboot_timeout: 0s

ota:
  - platform: esphome
    encryption:
      key: !secret sniffer_api_encryption_key

# Im Womo-WLAN per DHCP (gleiche Zugangsdaten wie die anderen ESPs), Adresse steht im USB-Log.
# Dauerhaft erreichbar ueber die feste WireGuard-Adresse.
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 0s
  # Modem-Sleep spart Strom. Der Stream wird dadurch etwas verzoegert, die Zeitstempel
  # entstehen aber auf dem ESP und bleiben genau.
  power_save_mode: light
  output_power: 11dB        # bei Abbruechen schrittweise erhoehen, kostet Strom
  ap:
    ssid: "VEBus-Sniffer Fallback"
    password: !secret fallback_ap_password

captive_portal:

time:
  - platform: sntp          # Pflicht fuer WireGuard (Handshake braucht die Uhrzeit)
    id: sntp_time

wireguard:
  address: 192.168.100.210  # Address aus der Fritzbox-.conf dieses Peers
  netmask: 255.255.255.0
  private_key: !secret sniffer_wg_private_key
  peer_endpoint: example.dyndns.org
  peer_port: 59004
  peer_public_key: !secret sniffer_wg_peer_public_key
  peer_preshared_key: !secret sniffer_wg_preshared_key
  peer_allowed_ips:
    - 192.168.100.0/24      # nur das Heimnetz durch den Tunnel, nicht 0.0.0.0/0 aus der .conf
  peer_persistent_keepalive: 25s
  reboot_timeout: 0s

binary_sensor:
  - platform: wireguard
    status:
      name: "WireGuard verbunden"

sensor:
  - platform: wireguard
    latest_handshake:
      name: "WireGuard letzter Handshake"
  - platform: wifi_signal
    name: "WLAN Signal"
    update_interval: 60s

text_sensor:
  - platform: wireguard
    address:
      name: "WireGuard Adresse"

interval:
  - interval: 30s
    then:
      - lambda: vebus_sniffer::log_stats();
