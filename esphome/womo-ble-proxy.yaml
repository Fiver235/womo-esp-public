# ===========================================================================
# Zweiter ESP32: Bluetooth-Proxy fuer die Truma LevelControl-Gassensoren
#
# - esp32_ble_tracker + bluetooth_proxy (active: true): Home Assistant zu Hause
#   baut ueber diesen ESP die aktive BLE-Verbindung zu den LevelControl-Sensoren
#   auf (Integration: cyclemat/HAOS-Truma-Levelcontrol-Integration, HACS).
# - wireguard: eigener Peer in der Fritzbox (NICHT derselbe wie der Alde-ESP),
#   Tunnel-Adresse 192.168.100.208. HA erreicht den ESP unter dieser Adresse
#   (ESPHome-Integration -> manuell hinzufuegen, Port 6053, proxy_api_encryption_key).
# - Platzierung: im Innenraum (WLAN ca. -63 dBm), im WLAN des Nighthawk M5, feste IP 192.168.1.241.
#
# - MultiPlus-Taster (seit 01.11.2026, ersetzt das Digital Multi Control):
#   federnder Schalter (EIN)-0-(AUS) an GPIO25/GPIO26 gegen GND. Jeder Tastendruck
#   schreibt EINMAL per Modbus TCP Register 33 (/Mode) am Color Control GX:
#   3 = Ein, 4 = Aus. Keine Wiederholung, kein Schreiben beim Start.
#   Konzept und Inbetriebnahme: docs/MULTIPLUS-SCHALTER.md
#
# Flashen (erstes Mal per USB, danach OTA):
#   .\.venv\Scripts\esphome.exe run esphome\womo-ble-proxy.yaml --device COMx
# ===========================================================================

substitutions:
  name: womo-ble-proxy
  friendly_name: "Womo BLE-Proxy"
  # Color Control GX im Womo-WLAN. Achtung: derzeit DHCP-Adresse; feste Adresse am GX
  # (Vorschlag .242) erst nach Freigabe eintragen und dann hier anpassen.
  gx_ip: "192.168.1.25"
  # Unit-ID des Dienstes com.victronenergy.vebus (GX: Modbus TCP -> Verfuegbare Dienste).
  # 246 ist der uebliche Wert fuer den VE.Bus-Port des CCGX, vor dem ersten Test pruefen.
  vebus_unit_id: "246"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  includes:
    - womo_modbus.h

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: DEBUG
  baud_rate: 115200

api:
  encryption:
    key: !secret proxy_api_encryption_key
  reboot_timeout: 0s        # HA ist nur ueber den Tunnel da; kein Neustart bei Verbindungsverlust

ota:
  - platform: esphome
    encryption:
      key: !secret proxy_api_encryption_key

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 0s
  manual_ip:                # feste IP im Womo-WLAN (freigegeben 27.10.2026), Alde-ESP hat .240
    static_ip: 192.168.1.241
    gateway: 192.168.1.1
    subnet: 255.255.255.0
    dns1: 192.168.1.1
  use_address: 192.168.1.241   # fuer esphome logs/run vom Notebook im Womo-WLAN
  ap:
    ssid: "Womo-BLE-Proxy Fallback"
    password: !secret fallback_ap_password

captive_portal:

time:
  - platform: sntp          # Pflicht fuer WireGuard (Handshake braucht die Uhrzeit)
    id: sntp_time

wireguard:
  address: 192.168.100.208  # Address aus der Fritzbox-.conf dieses Peers
  netmask: 255.255.255.0
  private_key: !secret proxy_wg_private_key
  peer_endpoint: example.dyndns.org
  peer_port: 59004
  peer_public_key: !secret proxy_wg_peer_public_key
  peer_preshared_key: !secret proxy_wg_preshared_key
  peer_allowed_ips:
    - 192.168.100.0/24      # nur das Heimnetz durch den Tunnel, nicht 0.0.0.0/0 aus der .conf
  peer_persistent_keepalive: 25s
  reboot_timeout: 0s

# Bluetooth-Proxy. active: true ist noetig, weil die LevelControl-Integration
# eine GATT-Verbindung aufbaut (Messung anstossen, verschluesselte Antwort lesen).
esp32_ble_tracker:
  scan_parameters:
    active: true

bluetooth_proxy:
  active: true

binary_sensor:
  - platform: wireguard
    status:
      name: "WireGuard verbunden"
  - platform: status
    name: "Proxy Status"

  # MultiPlus-Taster: Kontakt schliesst nach GND, interner Pull-up. Nur die Druckflanke
  # zaehlt; beide gleichzeitig = kein Befehl; die ersten 10 s nach dem Start werden ignoriert.
  - platform: gpio
    id: taster_ein
    name: "MultiPlus Taster EIN"
    icon: mdi:power-plug
    pin:
      number: GPIO25
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms
    on_press:
      - lambda: |-
          if (millis() < 10000) { ESP_LOGW("multiplus", "EIN ignoriert (Startphase)"); return; }
          if (id(taster_aus).state) { ESP_LOGW("multiplus", "EIN und AUS gleichzeitig, kein Befehl"); return; }
          if (womo_modbus::start_write("${gx_ip}", ${vebus_unit_id}, 33, 3)) {
            ESP_LOGI("multiplus", "Taster EIN -> Modus 3 an ${gx_ip}");
            id(multiplus_befehl).publish_state("EIN wird gesendet");
          } else {
            ESP_LOGW("multiplus", "EIN verworfen, vorheriger Befehl laeuft noch");
          }
  - platform: gpio
    id: taster_aus
    name: "MultiPlus Taster AUS"
    icon: mdi:power-plug-off
    pin:
      number: GPIO26
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms
    on_press:
      - lambda: |-
          if (millis() < 10000) { ESP_LOGW("multiplus", "AUS ignoriert (Startphase)"); return; }
          if (id(taster_ein).state) { ESP_LOGW("multiplus", "EIN und AUS gleichzeitig, kein Befehl"); return; }
          if (womo_modbus::start_write("${gx_ip}", ${vebus_unit_id}, 33, 4)) {
            ESP_LOGI("multiplus", "Taster AUS -> Modus 4 an ${gx_ip}");
            id(multiplus_befehl).publish_state("AUS wird gesendet");
          } else {
            ESP_LOGW("multiplus", "AUS verworfen, vorheriger Befehl laeuft noch");
          }

sensor:
  - platform: wireguard
    latest_handshake:
      name: "WireGuard letzter Handshake"
  - platform: wifi_signal
    name: "WLAN Signal"
    update_interval: 60s

text_sensor:
  - platform: wireguard
    address:
      name: "WireGuard Adresse"
  - platform: template
    id: multiplus_befehl
    name: "MultiPlus letzter Tasterbefehl"
    icon: mdi:message-processing

# Ergebnis der Modbus-Task in den Hauptloop holen (Entitaeten nur von hier aus aktualisieren).
interval:
  - interval: 250ms
    then:
      - lambda: |-
          static uint32_t seen = 0;
          uint32_t seq = womo_modbus::g_seq.load();
          if (seq == seen) return;
          seen = seq;
          const char *cmd = womo_modbus::g_value.load() == 3 ? "EIN" : "AUS";
          if (womo_modbus::g_result.load() == womo_modbus::OK) {
            ESP_LOGI("multiplus", "%s vom GX bestaetigt", cmd);
            id(multiplus_befehl).publish_state(std::string(cmd) + " bestaetigt");
          } else {
            ESP_LOGW("multiplus", "%s fehlgeschlagen: %s", cmd, womo_modbus::g_error);
            id(multiplus_befehl).publish_state(std::string(cmd) + " Fehler: " + womo_modbus::g_error);
          }

button:
  - platform: restart
    name: "Proxy Neustart"
