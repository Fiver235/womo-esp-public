# ===========================================================================
# Wie vebus-sniffer.yaml (passiver VE.Bus-Mitschnitt, kann nicht senden), zusaetzlich mit
# flankengenauer Aufzeichnung ueber die RMT-Einheit am selben RX-Pin (vebus_edges.h).
# Gleicher ESP32, gleicher Name, gleiche WireGuard-Adresse.
#
# Zweck: den echten Sync des MultiPlus Flanke fuer Flanke messen und mit dem Sync des ESP
# vergleichen, siehe docs/VEBUS-MITSCHNITT.md, "Flankenaufzeichnung".
# Verdrahtung wie beim Mitschnitt: TXD des Wandlers fest an VCC, ESP nur an A, B und GND.
#
#   .\.venv\Scripts\esphome.exe run esphome\vebus-sniffer-edges.yaml --device 192.168.100.210
#   python tools\vebus_capture.py capture --seconds 120
#   python tools\vebus_capture.py edges logs\<datei>.log
# ===========================================================================

substitutions:
  name: vebus-sniffer
  friendly_name: "VE.Bus Sniffer"
  rx_pin: "16"              # GPIO16 <- Modulausgang ueber Teiler 1k/2k (5 V -> 3,3 V)
  edges_every: "3"          # Flanken von jedem 3. Rahmen (zufaellig), 0 = aus; zur Laufzeit per Befehl E<n>
  tx_guard_pin: "17"        # bleibt dauerhaft High, siehe on_boot

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  includes:
    - vebus_sniffer.h
    - vebus_edges.h
  on_boot:
    - priority: 800         # so frueh wie moeglich
      then:
        # Sicherung: Haengt TXD des Wandlers noch ueber die Diode an GPIO17 (Werkbankaufbau), haelt High den
        # Sender aus. Ersetzt nicht "TXD fest an VCC": Waehrend des Bootens ist der Pin kurz offen.
        - lambda: |-
            gpio_set_direction((gpio_num_t) ${tx_guard_pin}, GPIO_MODE_OUTPUT);
            gpio_set_level((gpio_num_t) ${tx_guard_pin}, 1);
    - priority: -100        # nach dem Netzwerk-Stack
      then:
        - lambda: |-
            vebus_sniffer::start(${rx_pin});
            vebus_edges::start(${rx_pin}, ${edges_every});

esp32:
  board: esp32dev
  cpu_frequency: 80MHz      # reicht fuer 256 kBaud und spart Strom
  framework:
    type: esp-idf
    advanced:
      include_builtin_idf_components:
        - esp_driver_rmt    # ESPHome laesst den RMT-Treiber sonst weg

logger:
  level: INFO
  baud_rate: 115200

api:
  encryption:
    key: !secret sniffer_api_encryption_key
  reboot_timeout: 0s

ota:
  - platform: esphome
    encryption:
      key: !secret sniffer_api_encryption_key

# Im Womo-WLAN per DHCP (gleiche Zugangsdaten wie die anderen ESPs), Adresse steht im USB-Log.
# Dauerhaft erreichbar ueber die feste WireGuard-Adresse.
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 0s
  # Modem-Sleep spart Strom. Der Stream wird dadurch etwas verzoegert, die Zeitstempel
  # entstehen aber auf dem ESP und bleiben genau.
  power_save_mode: light
  output_power: 11dB        # bei Abbruechen schrittweise erhoehen, kostet Strom
  ap:
    ssid: "VEBus-Sniffer Fallback"
    password: !secret fallback_ap_password

captive_portal:

time:
  - platform: sntp          # Pflicht fuer WireGuard (Handshake braucht die Uhrzeit)
    id: sntp_time

wireguard:
  address: 192.168.100.210  # Address aus der Fritzbox-.conf dieses Peers
  netmask: 255.255.255.0
  private_key: !secret sniffer_wg_private_key
  peer_endpoint: example.dyndns.org
  peer_port: 59004
  peer_public_key: !secret sniffer_wg_peer_public_key
  peer_preshared_key: !secret sniffer_wg_preshared_key
  peer_allowed_ips:
    - 192.168.100.0/24      # nur das Heimnetz durch den Tunnel, nicht 0.0.0.0/0 aus der .conf
  peer_persistent_keepalive: 25s
  reboot_timeout: 0s

binary_sensor:
  - platform: wireguard
    status:
      name: "WireGuard verbunden"

sensor:
  - platform: wireguard
    latest_handshake:
      name: "WireGuard letzter Handshake"
  - platform: wifi_signal
    name: "WLAN Signal"
    update_interval: 60s

text_sensor:
  - platform: wireguard
    address:
      name: "WireGuard Adresse"

interval:
  - interval: 30s
    then:
      - lambda: |-
          vebus_sniffer::log_stats();
          vebus_edges::log_stats();
